name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # The old step asserted that the interpreter had no extra argv, which is
      # true of every invocation and says nothing about the declaration. The
      # contract lives in tests/test_packaging.py so it can fail.
      - name: zero dependencies
        run: python -m unittest tests.test_packaging -v
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: cross-check
        run: make cross
      # The demo's verdict is fixed by the trees it builds: the borrowed-mtime
      # section stands at fail, so the code is 2 and nothing else. This check used
      # to accept anything below 4 - and 1 is Python's code for an uncaught
      # exception, which is also this tool's code for *partial*. A crash read as a
      # verdict and the step stayed green.
      - name: demo runs without touching the repository
        run: |
          set +e
          before=$(git status --porcelain)
          python -m residue.demo > /dev/null
          code=$?
          after=$(git status --porcelain)
          set -e
          test "$code" -eq 2
          test "$before" = "$after"
      - name: install and run the console script
        run: |
          pip install -e .
          residue --help
          residue --version
          set +e
          residue demo > /dev/null
          code=$?
          set -e
          # The console entry has to agree with the module entry: a verdict, not
          # a crash. The demo's answer is 2; any other number is a broken entry.
          test "$code" -eq 2
