name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: zero dependencies
        run: python -c "import sys; assert not [p for p in sys.argv[1:] if p], sys.argv"
      - name: unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: cross-check
        run: make cross
      - name: demo runs without touching the repository
        run: |
          before=$(git status --porcelain)
          python -m residue.demo > /dev/null
          after=$(git status --porcelain)
          test "$before" = "$after"
      - name: install and run the console script
        run: |
          pip install -e .
          residue --help
          residue demo > /dev/null || true
