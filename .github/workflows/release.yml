name: release

# Publishing the release notes is done from CI rather than from a laptop: the
# repository owner and the browser session that opens GitHub are not necessarily
# the same account, and a release is not something to create by hand and hope.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: tag to publish
        required: true

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Publish release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          tag="${{ github.event.inputs.tag || github.ref_name }}"
          if gh release view "$tag" > /dev/null 2>&1; then
              echo "release $tag already exists; nothing to do"
              exit 0
          fi
          gh release create "$tag" \
              --title "$tag" \
              --notes-file docs/RELEASE-v0.1.0.md \
              --verify-tag
